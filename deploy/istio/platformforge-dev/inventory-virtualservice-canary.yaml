# Canary routing: 90% v0.1.0 / 10% v0.2.0, applied by each caller's sidecar per request,
# independent of how many pods each version runs (docs/CANARY_RELEASE.md).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: inventory-service
  namespace: platformforge-dev
  labels:
    app.kubernetes.io/part-of: platformforge
spec:
  hosts:
    - inventory-service.platformforge-dev.svc.cluster.local
  exportTo: ["."]
  http:
    - name: inventory
      route:
        - destination:
            host: inventory-service.platformforge-dev.svc.cluster.local
            subset: v0-1-0
            port:
              number: 8080
          weight: 90
        - destination:
            host: inventory-service.platformforge-dev.svc.cluster.local
            subset: v0-2-0
            port:
              number: 8080
          weight: 10
