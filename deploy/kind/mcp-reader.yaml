# Read-only identity for the local MCP server on kind-platformforge.
# Namespace platformforge-dev only. No secrets, exec, or writes.
# Do not apply this file to GKE.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformforge-mcp-reader
subjects:
  - kind: ServiceAccount
    name: platformforge-mcp-reader
    namespace: platformforge-dev
