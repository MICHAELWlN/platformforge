# grafana/alloy 1.14.0 (Alloy v1.21.0)
# One Deployment (not a DaemonSet) tailing platformforge-dev pod logs through the
# Kubernetes API. No hostPath, no root, no access outside that namespace.
crds:
  create: false

alloy:
  enableReporting: false
  storagePath: /tmp/alloy
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    seccompProfile:
      type: RuntimeDefault
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: alloy-data
        mountPath: /tmp/alloy
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["platformforge-dev"]
        }
      }

      discovery.relabel "platformforge" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.platformforge.output
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.platformforge-observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

rbac:
  create: true
  namespaces:
    - platformforge-dev
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]

controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: alloy-data
        emptyDir: {}

service:
  type: ClusterIP

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
