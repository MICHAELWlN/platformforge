# grafana-community/loki 18.17.1 (Loki 3.7.8)
# One monolithic replica, filesystem on emptyDir, no MinIO, no gateway, no canary.
# Auth is off: the Service is ClusterIP and the lab has no log tenant secret in git.
# A pod restart deletes every log line. See docs/OBSERVABILITY.md.
deploymentMode: Monolithic

rbac:
  namespaced: true
sidecar:
  rules:
    enabled: false

loki:
  auth_enabled: false
  analytics:
    reporting_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  sidecar: false
  persistence:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

podDisruptionBudget:
  enabled: false
