# grafana-community/grafana 14.0.1 (Grafana 13.2.4, distroless)
rbac:
  create: false
# ClusterIP only. The admin password is generated by the chart into a Secret and is
# not set here. Persistence is off: dashboards are provisioned from the repo, so a
# restart does not lose them. Datasource contents are not.
adminUser: admin

initChownData:
  enabled: false

persistence:
  enabled: false

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

grafana.ini:
  analytics:
    check_for_updates: false
    reporting_enabled: false
  log:
    mode: console
  server:
    root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
  # Viewer without a password. The Service is ClusterIP on a local kind cluster, same
  # trust boundary as Prometheus, Loki, and Tempo, which also have no auth. The admin
  # password stays in the generated Secret and is not written here.
  auth.anonymous:
    enabled: true
    org_role: Viewer

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.platformforge-observability.svc.cluster.local
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.platformforge-observability.svc.cluster.local:3100
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: "\"trace_id\":\"(\\w+)\""
              url: "$${__value.raw}"
              datasourceUid: tempo
              urlDisplayLabel: View trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.platformforge-observability.svc.cluster.local:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: false
            customQuery: true
            query: '{namespace="platformforge-dev"} |= "$${__trace.traceId}"'
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: platformforge
        orgId: 1
        folder: PlatformForge
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/platformforge

dashboardsConfigMaps:
  platformforge: platformforge-dashboards
