# Kubernetes identity that Terraform already allows to impersonate
# platformforge-dev-wi. It is not orders-service and it is not inventory-service.
# Those mesh identities stay without a Google binding.
# Applying this file does not grant a Google role. The GCP account still has
# none. Do not annotate the application ServiceAccounts with this email.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platformforge-gcp
  namespace: platformforge-dev
  labels:
    app.kubernetes.io/managed-by: platformforge
    app.kubernetes.io/part-of: platformforge
  annotations:
    iam.gke.io/gcp-service-account: platformforge-dev-wi@platformforge-dev-mn2026.iam.gserviceaccount.com
automountServiceAccountToken: false
