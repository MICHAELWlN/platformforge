# Read-only identity for MCP on the pinned GKE context.
# Namespace platformforge-dev only. No secrets, exec, or writes.
# Do not apply this file to kind. It does not create a GCP service account or key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # get only. Applied on the pinned GKE context.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    resourceNames: ["inventory-service"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platformforge-mcp-reader
  namespace: platformforge-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platformforge-mcp-reader
subjects:
  - kind: ServiceAccount
    name: platformforge-mcp-reader
    namespace: platformforge-dev
