name: Delivery

# Manual only. Pull requests do not receive a cloud token. Nothing is published
# or applied unless GitHub variable GCP_DELIVERY_ENABLED is the string true and
# a person dispatches this workflow from main. Apply to the cluster is still
# refused by platformforge.delivery.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Build and push linux/amd64 images by digest
        type: boolean
        default: false
        required: true
      version:
        description: Image version label. Deployments use the digest, not this tag.
        type: string
        default: "0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: platformforge-gke-delivery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish digests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish &&
      vars.GCP_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gke-delivery
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [inventory-service, orders-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require federation settings
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_DELIVERY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER"
          test -n "$SERVICE_ACCOUNT"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DELIVERY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build linux/amd64
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY: us-central1-docker.pkg.dev/platformforge-dev-mn2026/platformforge
        run: |
          set -euo pipefail
          case "$VERSION" in
            0.1.0|0.2.0) ;;
            *) echo "refusing version $VERSION" >&2; exit 1 ;;
          esac
          docker build \
            --platform linux/amd64 \
            --provenance=false \
            --target "${{ matrix.service }}" \
            --build-arg "VERSION=$VERSION" \
            --build-arg "GIT_SHA=${GITHUB_SHA::7}" \
            -t "${REGISTRY}/${{ matrix.service }}:${VERSION}" \
            services
          image="${REGISTRY}/${{ matrix.service }}:${VERSION}"
          docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
          docker image inspect "$image" --format '{{.Config.User}}' | grep -qx '65532:65532'
      - name: Scan before push
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: us-central1-docker.pkg.dev/platformforge-dev-mn2026/platformforge/${{ matrix.service }}:${{ inputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library
      - name: Push and print the digest
        env:
          REGISTRY: us-central1-docker.pkg.dev/platformforge-dev-mn2026/platformforge
          VERSION: ${{ inputs.version }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "${REGISTRY}/${{ matrix.service }}:${VERSION}"
          gcloud artifacts docker images describe \
            "${REGISTRY}/${{ matrix.service }}:${VERSION}" \
            --format='value(image_summary.digest)'

  gate:
    name: Delivery gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gke-delivery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Check the pinned target and refuse apply
        env:
          PLATFORMFORGE_DELIVERY_APPROVED: "1"
        run: |
          python -m platformforge.delivery gate \
            --context gke_platformforge-dev-mn2026_us-central1-a_platformforge-dev \
            --project platformforge-dev-mn2026 \
            --cluster platformforge-dev
          set +e
          python -m platformforge.delivery refuse-apply
          status="$?"
          set -e
          test "$status" -eq 2
          echo "apply remains refused"
