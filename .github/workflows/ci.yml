name: CI

# Runs without cloud credentials or a Kubernetes cluster. Integration tests
# (pytest -m integration) need a local kind cluster and are not run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src services tests
      - run: ruff format --check src services tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -m "not integration and not gke"

  images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [inventory-service, orders-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >
          docker build
          --platform linux/amd64
          --target "${{ matrix.service }}"
          --provenance=false
          --build-arg VERSION=0.2.0
          --build-arg GIT_SHA="${GITHUB_SHA::7}"
          -t "platformforge/${{ matrix.service }}:ci"
          services
      - name: Smoke test with a read-only root filesystem and no capabilities
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker image inspect "platformforge/${SERVICE}:ci" --format '{{.Config.User}}' | grep -qx '65532:65532'
          docker image inspect "platformforge/${SERVICE}:ci" --format '{{.Os}}/{{.Architecture}}' | grep -qx 'linux/amd64'
          docker run -d --name smoke --read-only --tmpfs /tmp:size=64m --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 "platformforge/${SERVICE}:ci"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/version | grep -q "\"service\":\"${SERVICE}\""
      - name: Container logs
        if: always()
        run: docker logs smoke || true
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platformforge/${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          vuln-type: os,library

  terraform:
    name: Terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  manifests:
    name: Manifest validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Validate ServiceManifest documents
        run: |
          set -euo pipefail
          for manifest in services/manifests/*.yaml services/manifests/incidents/*.yaml examples/*.yaml; do
            platformforge validate "$manifest"
          done
      - name: Reject public exposure in deploy documents
        run: |
          python - <<'PY'
          from pathlib import Path
          from platformforge.gke import exposure_findings
          roots = [Path("deploy"), Path("services/manifests"), Path("examples")]
          hits = []
          for root in roots:
              for path in root.rglob("*.yaml"):
                  hits.extend(f"{path}: {item}" for item in exposure_findings(path.read_text()))
          if hits:
              raise SystemExit("\n".join(hits))
          PY

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e .
      - run: python -m platformforge.secretscan

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit==2.10.0
      - run: pip-audit -r services/requirements.txt --progress-spinner off
