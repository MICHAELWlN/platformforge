name: CI

# Runs without cloud credentials or a Kubernetes cluster. Integration tests
# (pytest -m integration) need a local kind cluster and are not run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src services tests
      - run: ruff format --check src services tests

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -m "not integration"

  images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [inventory-service, orders-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >
          docker build
          --target "${{ matrix.service }}"
          --provenance=false
          --build-arg VERSION=0.2.0
          --build-arg GIT_SHA="${GITHUB_SHA::7}"
          -t "platformforge/${{ matrix.service }}:ci"
          services
      - name: Smoke test with a read-only root filesystem and no capabilities
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker image inspect "platformforge/${SERVICE}:ci" --format '{{.Config.User}}' | grep -qx '65532:65532'
          docker run -d --name smoke --read-only --tmpfs /tmp:size=64m --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 "platformforge/${SERVICE}:ci"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/version | grep -q "\"service\":\"${SERVICE}\""
      - name: Container logs
        if: always()
        run: docker logs smoke || true
