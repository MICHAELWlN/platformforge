apiVersion: platformforge.dev/v1alpha1
kind: ServiceManifest
metadata:
  name: orders-service
  namespace: platformforge-dev
spec:
  # Built locally and loaded into kind (`make images kind-load`); not pulled from a registry.
  image: platformforge/orders-service:0.2.0
  # Its own identity: inventory-service's AuthorizationPolicy allows exactly this principal.
  serviceAccountName: orders-service
  replicas: 2
  port: 8080
  env:
    - name: LOG_LEVEL
      value: info
    # Internal Kubernetes Service DNS name of inventory-service (ClusterIP, never public).
    - name: INVENTORY_URL
      value: http://inventory-service.platformforge-dev.svc.cluster.local:8080
    - name: INVENTORY_TIMEOUT_SECONDS
      value: "2"
    # OTLP/HTTP to Tempo. No credentials; spans carry the request ID, not bodies or headers.
    - name: OTEL_SERVICE_NAME
      value: orders-service
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://tempo.platformforge-observability.svc.cluster.local:4318
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_TRACES_SAMPLER
      value: parentbased_always_on
    - name: OTEL_BSP_SCHEDULE_DELAY
      value: "1000"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    readiness:
      path: /readyz
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  termination:
    gracePeriodSeconds: 30
    preStopSleepSeconds: 5
