apiVersion: platformforge.dev/v1alpha1
kind: ServiceManifest
metadata:
  name: inventory-service
  namespace: platformforge-dev
spec:
  # Built locally and loaded into kind (`make images kind-load`); not pulled from a registry.
  image: platformforge/inventory-service:0.1.0
  # Stable track. Renders Deployment inventory-service-v0-1-0; the inventory-service Service
  # selects every version, and Istio subsets split traffic between them (docs/CANARY_RELEASE.md).
  version: v0.1.0
  serviceAccountName: inventory-service
  replicas: 2
  port: 8080
  env:
    - name: LOG_LEVEL
      value: info
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  probes:
    readiness:
      path: /readyz
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
  termination:
    # preStop sleep lets endpoint removal reach every Envoy before SIGTERM; uvicorn then
    # drains for up to 10s. 5 + 10 < 30 leaves headroom before SIGKILL.
    gracePeriodSeconds: 30
    preStopSleepSeconds: 5
