[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "platformforge"
version = "0.1.0"
description = "PlatformForge internal developer platform CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.27,<0.28",
    "pydantic>=2.14,<3",
    "kubernetes>=37,<38",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
platformforge = "platformforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a local kind cluster; opt in with PLATFORMFORGE_IT_CONTEXT",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
